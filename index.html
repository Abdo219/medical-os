<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F4C81">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>MEDICAL OS</title>
<style>
:root{
  --primary:#0F4C81;--primary-600:#0d4373;--primary-50:#e8f0f7;
  --secondary:#14B8A6;--accent:#D4AF37;
  --bg:#F7F9FC;--surface:#fff;--surface-2:#F1F5F9;--border:#E2E8F0;
  --text:#0F172A;--muted:#64748B;--muted-2:#94A3B8;
  --success:#16A34A;--danger:#DC2626;--warning:#F59E0B;
  --ring-bg:#E2E8F0;
  --radius:16px;--shadow:0 4px 14px rgba(15,23,42,.07);
  --shadow-lg:0 20px 40px rgba(15,23,42,.12);
  --bottom-h:66px;--sidebar-w:250px;
  --font:"Segoe UI",Tahoma,system-ui,sans-serif;
}
[data-theme="dark"]{
  --bg:#0B1220;--surface:#111B2E;--surface-2:#182338;--border:#1F2A44;
  --text:#E6EEF7;--muted:#94A3B8;--primary-50:#0e2540;--ring-bg:#1F2A44;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);
  line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}

#app{display:flex;min-height:100dvh}
.sidebar{display:none;width:var(--sidebar-w);background:var(--surface);
  border-left:1px solid var(--border);padding:16px 10px;position:sticky;
  top:0;height:100dvh;overflow-y:auto;flex-shrink:0}
.main{flex:1;min-width:0;padding-bottom:calc(var(--bottom-h) + 12px);
  display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:var(--bg);
  padding:12px 14px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px}
.view{padding:14px;max-width:1100px;width:100%;margin:0 auto}
.loading-screen{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px;text-align:center}
.loading-screen .brand-logo{margin:0 auto 14px;width:52px;height:52px}

.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.brand-logo{width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px}
.brand-txt b{display:block;font-size:14px}
.brand-txt span{font-size:10.5px;color:var(--muted)}

.nav-group h4{font-size:10px;font-weight:700;color:var(--muted-2);
  text-transform:uppercase;letter-spacing:.06em;padding:10px 10px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;
  border-radius:9px;color:var(--muted);font-weight:600;font-size:13.5px;
  width:100%;text-align:right;transition:.15s}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--primary-50);color:var(--primary)}

.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:40;
  height:calc(var(--bottom-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:var(--surface);
  border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr)}
.bn-item{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;color:var(--muted-2);font-size:10px;font-weight:600;padding:6px 2px}
.bn-item.active{color:var(--primary)}
.bn-item .ic{font-size:20px;line-height:1}

.fab{position:fixed;left:16px;
  bottom:calc(var(--bottom-h) + env(safe-area-inset-bottom) + 14px);
  z-index:45;width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--primary-600));
  color:#fff;font-size:26px;font-weight:300;
  box-shadow:0 8px 20px rgba(15,76,129,.45);display:grid;place-items:center}
.fab:active{transform:scale(.94)}

.card{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.card-head{display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-bottom:10px}
.card-head h3{font-size:14.5px;font-weight:700}

.hero{background:linear-gradient(135deg,#0F4C81,#0a3d68 60%,#0e2a4a);
  color:#fff;border-radius:22px;padding:18px;position:relative;
  overflow:hidden;margin-bottom:14px;box-shadow:0 12px 28px rgba(15,76,129,.3)}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;
  width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(20,184,166,.4),transparent 70%)}
.hero .hello{font-size:12.5px;opacity:.9}
.hero .date{font-size:11px;opacity:.7;margin-top:2px}
.hero-row{display:flex;align-items:center;gap:14px;margin-top:12px;position:relative;z-index:1}
.hero-score{font-size:38px;font-weight:800;line-height:1}
.hero-score small{font-size:14px;opacity:.7}
.hero-streak{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);
  padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
.hero-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.75}

.grid{display:grid;gap:10px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.grid-4{grid-template-columns:repeat(4,1fr)}}

.stat{background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:11px;display:flex;flex-direction:column;gap:3px}
.stat .label{font-size:10.5px;color:var(--muted);font-weight:600}
.stat .value{font-size:20px;font-weight:800;line-height:1.1}
.stat .sub{font-size:10.5px;color:var(--muted-2)}

.qa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa{background:var(--surface);border:1px solid var(--border);border-radius:13px;
  padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;
  font-size:10.5px;font-weight:600;color:var(--text);box-shadow:var(--shadow)}
.qa:hover{border-color:var(--primary);color:var(--primary)}
.qa-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  font-size:17px;background:var(--primary-50);color:var(--primary)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 14px;border-radius:11px;font-weight:700;font-size:13px;
  border:1px solid transparent;transition:.15s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-600)}
.btn-soft{background:var(--primary-50);color:var(--primary)}
.btn-outline{background:transparent;border-color:var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-block{width:100%}
.btn-sm{padding:6px 10px;font-size:11.5px;border-radius:9px}
.btn:active{transform:scale(.97)}

.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;
  border-radius:999px;font-size:11px;font-weight:600;
  background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.chip.blue{background:rgba(15,76,129,.1);color:var(--primary);border-color:rgba(15,76,129,.25)}
.chip.green{background:rgba(22,163,74,.1);color:var(--success);border-color:rgba(22,163,74,.25)}
.chip.red{background:rgba(220,38,38,.1);color:var(--danger);border-color:rgba(220,38,38,.25)}
.chip.gold{background:rgba(212,175,55,.15);color:#8a6d1a;border-color:rgba(212,175,55,.4)}

.bar{height:8px;border-radius:999px;background:var(--ring-bg);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--primary),var(--secondary));
  transition:width .5s ease}

.ring circle{transition:stroke-dashoffset .6s ease}

.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;padding:11px;border-radius:12px;
  background:var(--surface);border:1px solid var(--border)}
.row .r-main{flex:1;min-width:0}
.row .r-title{font-weight:700;font-size:13.5px}
.row .r-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.row .r-ic{width:36px;height:36px;border-radius:9px;flex-shrink:0;
  display:grid;place-items:center;background:var(--primary-50);color:var(--primary);font-size:17px}
.row .r-actions{display:flex;gap:5px}

.fld{display:block;margin-bottom:11px}
.fld > span{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:10px 11px;border-radius:10px;
  border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  font-size:13.5px;outline:none;transition:.15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{
  border-color:var(--primary);background:var(--surface);
  box-shadow:0 0 0 3px rgba(15,76,129,.1)}
.fld textarea{resize:vertical;min-height:70px}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fld-range output{background:var(--primary-50);color:var(--primary);
  font-weight:700;padding:1px 7px;border-radius:6px;font-size:11.5px;margin-right:5px}
input[type=range]{accent-color:var(--primary);width:100%}

.backdrop{position:fixed;inset:0;background:rgba(2,6,23,.55);
  z-index:90;animation:fade .15s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:100;
  background:var(--surface);border-radius:20px 20px 0 0;
  max-height:92dvh;overflow:hidden;display:flex;flex-direction:column;
  animation:slideUp .25s ease;padding-bottom:env(safe-area-inset-bottom)}
.sheet-head{padding:12px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between}
.sheet-head h3{font-size:14.5px}
.sheet-head .close{width:32px;height:32px;border-radius:50%;
  background:var(--surface-2);display:grid;place-items:center;font-size:18px}
.sheet-body{padding:14px 16px;overflow-y:auto;flex:1}
.sheet-foot{padding:10px 16px;border-top:1px solid var(--border);
  display:flex;gap:8px;background:var(--surface)}
.sheet-foot .btn{flex:1}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(min-width:768px){
  .sheet{left:auto;right:20px;bottom:20px;width:500px;border-radius:18px;max-height:85dvh}
}

.toast{position:fixed;left:50%;bottom:calc(var(--bottom-h) + 20px);
  transform:translateX(-50%);z-index:200;background:#0F172A;color:#fff;
  padding:10px 14px;border-radius:11px;font-size:12.5px;font-weight:600;
  max-width:90vw;box-shadow:var(--shadow-lg);animation:toastIn .2s}
[data-theme="dark"] .toast{background:#1e293b;border:1px solid var(--border)}
@keyframes toastIn{from{transform:translate(-50%,8px);opacity:0}}

.empty{text-align:center;padding:28px 14px;color:var(--muted)}
.empty .ic{font-size:30px;margin-bottom:6px;opacity:.6}
.empty h4{color:var(--text);font-size:13.5px;margin-bottom:3px}
.empty p{font-size:12px;margin-bottom:12px}

.tabs{display:flex;gap:3px;background:var(--surface-2);padding:3px;
  border-radius:11px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:max-content;padding:7px 12px;border-radius:8px;
  font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.tab.active{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}

.insight{display:flex;gap:10px;padding:10px;border-radius:11px;
  background:var(--surface-2);border:1px solid var(--border);margin-bottom:7px}
.insight .ic{font-size:18px;flex-shrink:0}
.insight p{font-size:12.5px;line-height:1.5}

.tl{position:relative;padding-right:18px}
.tl::before{content:"";position:absolute;right:5px;top:6px;bottom:6px;
  width:2px;background:var(--border)}
.tl-item{position:relative;padding:7px 0;font-size:13px}
.tl-item::before{content:"";position:absolute;right:-17px;top:12px;
  width:9px;height:9px;border-radius:50%;background:var(--primary);
  border:2px solid var(--bg)}

.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}
.bold{font-weight:700}.center{text-align:center}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}
.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}
.flex{display:flex}.between{justify-content:space-between}
.between-center{justify-content:space-between;align-items:center}
.items-center{align-items:center}.gap-6{gap:6px}.gap-10{gap:10px}
.hidden{display:none !important}

@media(min-width:1024px){
  .sidebar{display:block}
  .bottomnav{display:none}
  .main{padding-bottom:20px}
  .fab{bottom:20px;left:auto;right:calc(var(--sidebar-w) + 20px)}
  .view{padding:18px}
  .toast{bottom:20px}
}
@media print{
  .sidebar,.bottomnav,.fab,.topbar,.tabs,.qa-grid,.btn{display:none !important}
  body{background:#fff;color:#000}
}
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar" class="sidebar"></aside>
  <main class="main">
    <header id="topbar" class="topbar"></header>
    <section id="view" class="view"></section>
  </main>
  <nav id="bottomnav" class="bottomnav"></nav>
  <button id="fab" class="fab" aria-label="إضافة سريعة">+</button>
</div>

<div id="backdrop" class="backdrop" hidden></div>
<aside id="sheet" class="sheet" hidden></aside>
<div id="toast" class="toast" hidden></div>
<div id="loading" class="loading-screen"><div><div class="brand-logo">M</div><b>Loading Medical OS...</b><p class="muted small mt-8">جارٍ فتح قاعدة بياناتك المحلية</p></div></div>

<!-- Optional local Chart.js: copy chart.umd.min.js to lib/ for offline charts. -->
<script src="lib/chart.umd.min.js" onerror="window.__noChart=1"></script>

<script>
'use strict';

/* ============================================================
   CONSTANTS
============================================================ */
const STORAGE_KEY='medicalos.v1';
const SPECIALTIES=['Cardiology','Respiratory','Gastroenterology','Neurology','Nephrology',
'Endocrinology','Hematology','Infectious Disease','Rheumatology','Emergency Medicine',
'Surgery','Pediatrics','Obstetrics & Gynecology','Psychiatry','Dermatology','ENT',
'Ophthalmology','Urology','Orthopedics','Anesthesia','ICU'];

const SKILL_PRESETS=[
['IV Cannulation','Procedures',50],['Venipuncture','Procedures',50],
['IM Injection','Procedures',30],['SC Injection','Procedures',20],
['ECG','Diagnostics',50],['ABG Sampling','Procedures',30],
['Urinary Catheterization','Procedures',25],['NG Tube','Procedures',20],
['Airway Management','Emergency',15],['Suturing','Procedures',40],
['Wound Dressing','Procedures',50],['Blood Sampling','Procedures',50],
['Blood Culture','Procedures',20],['Foley Catheter','Procedures',25],
['CPR','Emergency',10],['BLS','Emergency',5],['ACLS','Emergency',5],
['Oxygen Therapy','Respiratory',30],['Nebulization','Respiratory',30],
['Glucose Measurement','Diagnostics',50],['Vital Signs','Basic',100],
['History Taking','Examination',50],['CVS Examination','Examination',40],
['Respiratory Examination','Examination',40],['Abdominal Examination','Examination',40],
['Neurological Examination','Examination',30],['PV Examination','Examination',20]
];

const SETTINGS_TYPES=['ER','Ward','ICU','OPD','OR','Clinic','Other'];
const DIFFICULTY=['Easy','Moderate','Difficult'];
const CASE_STATUS=['Observed','Assisted','Performed','Managed'];
const PEARL_SOURCES=['Consultant','Book','Guideline','Case','Lecture','Other'];
const PEARL_IMPORTANCE=['Low','Medium','High'];
const RESEARCH_TYPES=['Systematic Review','Meta-analysis','Original Research','Narrative Review','Case Report','Database Study'];
const RESEARCH_STATUS=['Idea','Searching','Screening','Extraction','Analysis','Writing','Submitted','Published'];
const TASK_CATEGORIES=['Study','Clinical','Reading','Research','Workout','Qbank','Revision','Other'];
const PRIORITIES=['Low','Medium','High'];
const VIDEO_STATUS=['Not Started','In Progress','Completed'];
const BOOK_TYPES=['Exam','Clinical','Reference','Guidelines','Articles','Reading','Other'];

/* ============================================================
   UTILS
============================================================ */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const uid=()=>crypto?.randomUUID?.()||`m-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,10)}`;
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const todayISO=()=>{const d=new Date();d.setHours(0,0,0,0);return d.toISOString().slice(0,10)};
const isoOf=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x.toISOString().slice(0,10)};
const parseISO=s=>{const d=new Date(s+'T00:00:00');return isNaN(d)?null:d};
const fmtDate=s=>{const d=parseISO(s);return d?d.toLocaleDateString('ar-EG',{day:'numeric',month:'short',year:'numeric'}):'—'};
const fmtDateShort=s=>{const d=parseISO(s);return d?d.toLocaleDateString('ar-EG',{day:'numeric',month:'short'}):'—'};
const fmtDayName=s=>{const d=parseISO(s);return d?d.toLocaleDateString('ar-EG',{weekday:'long'}):''};
const addDays=(iso,n)=>{const d=parseISO(iso);d.setDate(d.getDate()+n);return isoOf(d)};
const startOfWeek=(iso=todayISO())=>{const d=parseISO(iso);const dow=d.getDay();
  const diff=(dow+1)%7;d.setDate(d.getDate()-diff);return isoOf(d)};
const endOfWeek=(iso=todayISO())=>addDays(startOfWeek(iso),6);
const startOfMonth=(iso=todayISO())=>iso.slice(0,7)+'-01';
const endOfMonth=(iso=todayISO())=>{const d=parseISO(iso);
  const last=new Date(d.getFullYear(),d.getMonth()+1,0);return isoOf(last)};
const withinRange=(iso,a,b)=>iso>=a&&iso<=b;
const daysBetween=(a,b)=>{const d1=parseISO(a),d2=parseISO(b);
  return(!d1||!d2)?0:Math.round((d2-d1)/86400000)};
const sum=(arr,f=x=>x)=>arr.reduce((a,b)=>a+(Number(f(b))||0),0);
const avg=(arr,f=x=>x)=>arr.length?sum(arr,f)/arr.length:0;
const pct=(v,m)=>m>0?Math.min(100,Math.round((v/m)*100)):0;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const num=(v,d=0)=>{const n=parseFloat(v);return isNaN(n)?d:n};
const int=(v,d=0)=>{const n=parseInt(v,10);return isNaN(n)?d:n};
const sortBy=(arr,k,d='desc')=>[...arr].sort((a,b)=>{const av=k(a),bv=k(b);
  if(av<bv)return d==='asc'?-1:1;if(av>bv)return d==='asc'?1:-1;return 0});

const download=(name,content,mime='application/json')=>{
  const blob=content instanceof Blob?content:new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
};

/* ============================================================
   STORE — in-memory UI cache backed by IndexedDB
   The synchronous API preserves the existing views; every mutation is
   immediately queued to IndexedDB, the durable source of truth.
============================================================ */
const Store={
  data:null,
  collections:['skills','skillSessions','cases','pearls','courses','videos','books',
    'readingSessions','questionBanks','questionSessions','researchProjects','notes',
    'tasks','goals'],
  db:null, lastSave:null, migrationRan:false,
  defaults(){
    const now=new Date().toISOString();
    return{
      version:'1.0.0',createdAt:now,updatedAt:now,
      settings:{
        theme:'light',
        profile:{name:'',targetExam:'MRCP'},
        targets:{questions:50,pages:20,videos:1,clinical:1,studyMinutes:120,researchMinutes:30},
        weights:{clinical:30,study:25,questions:20,reading:15,research:10}
      },
      skills:[],skillSessions:[],cases:[],pearls:[],
      courses:[],videos:[],books:[],readingSessions:[],
      questionBanks:[],questionSessions:[],
      researchProjects:[],notes:[],tasks:[],goals:[]
    };
  },
  async load(){
    try{
      this.db=await this.openDB();
      const hasData=await this.hasData();
      if(!hasData) await this.migrateLegacy();
      const def=this.defaults(); const loaded={...def};
      for(const c of this.collections) loaded[c]=await this.all(c);
      const settings=await this.getRecord('settings','app');
      loaded.settings={...def.settings,...(settings?.value||{})};
      const meta=await this.getRecord('metadata','app');
      loaded.createdAt=meta?.createdAt||def.createdAt; loaded.updatedAt=meta?.updatedAt||def.updatedAt;
      this.data=loaded;
      if(!hasData && !this.migrationRan) await this.persistAll();
      this.lastSave=loaded.updatedAt;
    }catch(e){ console.error('IndexedDB load failed',e); this.data=this.defaults(); toast('تعذر فتح قاعدة البيانات المحلية','error'); }
  },
  openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('medicalOS',2);req.onupgradeneeded=()=>{const db=req.result;[...this.collections,'settings','metadata'].forEach(n=>{if(!db.objectStoreNames.contains(n))db.createObjectStore(n,{keyPath:'id'})})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})},
  tx(names,mode='readonly'){return this.db.transaction(names,mode)},
  request(req){return new Promise((resolve,reject)=>{req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})},
  async all(name){return this.request(this.tx(name).objectStore(name).getAll())},
  async getRecord(name,id){return this.request(this.tx(name).objectStore(name).get(id))},
  async hasData(){const meta=await this.getRecord('metadata','app'); return !!meta},
  async migrateLegacy(){
    const raw=localStorage.getItem(STORAGE_KEY); if(!raw)return;
    try{const legacy=JSON.parse(raw); if(!legacy||typeof legacy!=='object')return; this.data={...this.defaults(),...legacy,settings:{...this.defaults().settings,...(legacy.settings||{})}}; this.collections.forEach(c=>{if(!Array.isArray(this.data[c]))this.data[c]=[]}); await this.persistAll(); this.migrationRan=true; toast('تم نقل بياناتك القديمة بأمان','success');}
    catch(e){console.warn('Legacy migration failed',e);toast('تعذر نقل البيانات القديمة','error')}
  },
  save(){this.data.updatedAt=new Date().toISOString();this.lastSave=this.data.updatedAt;this.persistAll().catch(e=>{console.error(e);toast('لم يتم حفظ البيانات. حاول مرة أخرى.','error')})},
  async persistAll(){if(!this.db)return;const t=this.tx([...this.collections,'settings','metadata'],'readwrite');for(const c of this.collections){const s=t.objectStore(c);s.clear();(this.data[c]||[]).forEach(x=>s.put({...x,id:x.id||uid(),updatedAt:x.updatedAt||new Date().toISOString()}))}t.objectStore('settings').put({id:'app',value:this.data.settings,updatedAt:new Date().toISOString()});t.objectStore('metadata').put({id:'app',schemaVersion:2,createdAt:this.data.createdAt,updatedAt:this.data.updatedAt});await new Promise((resolve,reject)=>{t.oncomplete=resolve;t.onerror=()=>reject(t.error)})},
  write(col,record){if(!this.db)return;const t=this.tx([col,'metadata'],'readwrite');t.objectStore(col).put(record);t.objectStore('metadata').put({id:'app',schemaVersion:2,createdAt:this.data.createdAt,updatedAt:record.updatedAt||new Date().toISOString()});t.onerror=()=>toast('لم يتم حفظ البيانات. حاول مرة أخرى.','error')},
  erase(col,id){if(!this.db)return;const now=new Date().toISOString(),t=this.tx([col,'metadata'],'readwrite');t.objectStore(col).delete(id);t.objectStore('metadata').put({id:'app',schemaVersion:2,createdAt:this.data.createdAt,updatedAt:now});this.lastSave=now;t.onerror=()=>toast('لم يتم حفظ البيانات. حاول مرة أخرى.','error')},
  get(k){return this.data[k]},
  add(col,item){
    const now=new Date().toISOString(),rec={id:uid(),createdAt:now,updatedAt:now,...item};
    this.data[col].unshift(rec);this.write(col,rec);this.lastSave=now;return rec;
  },
  update(col,id,patch){
    const i=this.data[col].findIndex(x=>x.id===id);
    if(i<0)return null;
    this.data[col][i]={...this.data[col][i],...patch,updatedAt:new Date().toISOString()};
    this.write(col,this.data[col][i]);this.lastSave=this.data[col][i].updatedAt;return this.data[col][i];
  },
  remove(col,id){
    const before=this.data[col].length;
    this.data[col]=this.data[col].filter(x=>x.id!==id);
    if(this.data[col].length<before)this.erase(col,id);return this.data[col].length<before;
  },
  find(col,id){return this.data[col].find(x=>x.id===id)}
};

let toastTimer;

  const el=$('#toast');el.hidden=false;el.textContent=msg;
  el.style.background=kind==='error'?'#DC2626':kind==='success'?'#16A34A':

let sheetOnSubmit=null;
function openSheet({title,bodyHTML,submitLabel='حفظ',onSubmit,hideSubmit=false}){
  sheetOnSubmit=onSubmit||null;
  const sheet=$('#sheet');
  $('#backdrop').hidden=false;sheet.hidden=false;
  sheet.innerHTML=`
    <div class="sheet-head">
      <h3>${esc(title)}</h3>
      <button class="close" data-sheet-close>×</button>
    </div>
    <form id="sheet-form" novalidate>
      <div class="sheet-body">${bodyHTML}</div>
      ${hideSubmit?'':`<div class="sheet-foot">
        <button type="button" class="btn btn-outline" data-sheet-close>إلغاء</button>
        <button type="submit" class="btn btn-primary">${esc(submitLabel)}</button>
      </div>`}
    </form>`;
  document.body.style.overflow='hidden';
  const first=sheet.querySelector('input,select,textarea');
  if(first)setTimeout(()=>first.focus(),100);
}
function closeSheet(){
  const sheet=$('#sheet');
  sheet.hidden=true;sheet.innerHTML='';
  $('#backdrop').hidden=true;
  document.body.style.overflow='';sheetOnSubmit=null;
}

document.addEventListener('click',e=>{
  if(e.target.closest('[data-sheet-close]')||e.target.id==='backdrop')closeSheet();
});
document.addEventListener('submit',e=>{
  if(e.target.id==='sheet-form'){
    e.preventDefault();
    if(!sheetOnSubmit)return closeSheet();
    const fd=Object.fromEntries(new FormData(e.target).entries());
    const res=sheetOnSubmit(fd,e.target);
    if(res!==false)closeSheet();
  }
});

/* ---------- Form builder ---------- */
function field(f,val){
  const v=val??f.value??'';
  const req=f.required?'required':'';
  const ph=f.placeholder?`placeholder="${esc(f.placeholder)}"`:'';
  switch(f.type){
    case 'textarea':
      return `<label class="fld"><span>${esc(f.label)}</span>
        <textarea name="${f.name}" ${req} rows="${f.rows||3}" ${ph}>${esc(v)}</textarea></label>`;
    case 'select':{
      const opts=(f.options||[]).map(o=>{
        const value=Array.isArray(o)?o[0]:o;
        const label=Array.isArray(o)?o[1]:o;
        return `<option value="${esc(value)}" ${value==v?'selected':''}>${esc(label)}</option>`;
      }).join('');
      return `<label class="fld"><span>${esc(f.label)}</span>
        <select name="${f.name}" ${req}>${opts}</select></label>`;
    }
    case 'number':
      return `<label class="fld"><span>${esc(f.label)}</span>
        <input type="number" name="${f.name}" ${req} value="${esc(v)}"
          min="${f.min??''}" max="${f.max??''}" step="${f.step??'1'}" ${ph}></label>`;
    case 'date':
      return `<label class="fld"><span>${esc(f.label)}</span>
        <input type="date" name="${f.name}" ${req} value="${esc(v||todayISO())}"></label>`;
    case 'range':
      return `<label class="fld"><span>${esc(f.label)} <output>${v||f.value||3}</output></span>
        <input type="range" name="${f.name}" min="${f.min||1}" max="${f.max||5}" step="1"
          value="${v||f.value||3}"
          oninput="this.parentElement.querySelector('output').textContent=this.value"></label>`;
    default:
      return `<label class="fld"><span>${esc(f.label)}</span>
        <input type="${f.type||'text'}" name="${f.name}" ${req} value="${esc(v)}" ${ph}></label>`;
  }
}
function formHTML(schema,values={}){
  let html='',i=0;
  while(i<schema.length){
    const f=schema[i];
    if(f.half&&schema[i+1]?.half){
      html+=`<div class="fld-row">${field(f,values[f.name])}${field(schema[i+1],values[schema[i+1].name])}</div>`;
      i+=2;
    } else {html+=field(f,values[f.name]);i++}
  }
  return html;
}

============================================================ */
const Calc={
  skillAttempts(id){return sum(Store.get('skillSessions').filter(s=>s.skillId===id),s=>s.count||1)},
  totalSkillAttempts(){return sum(Store.get('skillSessions'),s=>s.count||1)},
  skillAttemptsIn(a,b){return sum(Store.get('skillSessions').filter(s=>withinRange(s.date,a,b)),s=>s.count||1)},
  casesIn(a,b){return Store.get('cases').filter(c=>withinRange(c.date,a,b))},
  questionsIn(a,b){
    const s=Store.get('questionSessions').filter(x=>withinRange(x.date,a,b));
    const total=sum(s,x=>x.count);
    const correct=sum(s,x=>x.correct);
    return{total,correct,wrong:total-correct,sessions:s,
      accuracy:total?Math.round((correct/total)*100):0};
  },
  pagesIn(a,b){return sum(Store.get('readingSessions').filter(x=>withinRange(x.date,a,b)),x=>x.pages)},
  videosIn(a,b){
    return Store.get('videos').filter(v=>v.completedAt&&withinRange(v.completedAt.slice(0,10),a,b)).length;
  },
  researchMinutesIn(a,b){
    return sum(Store.get('researchProjects').flatMap(p=>p.sessions||[])
      .filter(s=>withinRange(s.date,a,b)),s=>s.minutes);
  },
  streak(){
    const all=new Set();
    Store.get('skillSessions').forEach(s=>s.date&&all.add(s.date));
    Store.get('questionSessions').forEach(s=>s.date&&all.add(s.date));
    Store.get('readingSessions').forEach(s=>s.date&&all.add(s.date));
    Store.get('cases').forEach(c=>c.date&&all.add(c.date));
    Store.get('tasks').filter(t=>t.done&&t.date).forEach(t=>all.add(t.date));
    if(!all.size)return{current:0,best:0};
    const days=[...all].sort();
    let best=1,cur=1;
    for(let i=1;i<days.length;i++){
      if(daysBetween(days[i-1],days[i])===1)cur++;else cur=1;
      if(cur>best)best=cur;
    }
    let current=0;
    let cursor=todayISO();
    if(!all.has(cursor))cursor=addDays(cursor,-1);
    while(all.has(cursor)){current++;cursor=addDays(cursor,-1)}
    return{current,best};
  },
  subScores(){
    const s=startOfWeek(),e=endOfWeek();
    const t=Store.get('settings').targets;
    const clinical=pct(this.skillAttemptsIn(s,e),(t.clinical||1)*7);
    const studyMin=sum(Store.get('readingSessions').filter(r=>withinRange(r.date,s,e)),r=>r.duration||0)
      +sum(Store.get('questionSessions').filter(q=>withinRange(q.date,s,e)),q=>q.duration||0);
    const study=pct(studyMin,(t.studyMinutes||120)*7);
    const q=this.questionsIn(s,e);
    const questions=pct(q.total,(t.questions||50)*7);
    const pages=this.pagesIn(s,e);
    const reading=pct(pages,(t.pages||20)*7);
    const rm=this.researchMinutesIn(s,e);
    const research=pct(rm,(t.researchMinutes||30)*7);
    return{clinical,study,questions,reading,research};
  },
  progressScore(){
    const w=Store.get('settings').weights;
    const s=this.subScores();
    const total=Object.values(w).reduce((a,b)=>a+b,0)||1;
    const val=Object.keys(w).reduce((acc,k)=>acc+(s[k]||0)*(w[k]||0),0)/total;
    return{score:Math.round(val),parts:s};
  },
  todayStats(){
    const d=todayISO();
    return{
      skills:this.skillAttemptsIn(d,d),
      cases:this.casesIn(d,d).length,
      questions:this.questionsIn(d,d),
      pages:this.pagesIn(d,d),
      videos:this.videosIn(d,d),
      research:this.researchMinutesIn(d,d)
    };
  },
  weekStats(){
    const s=startOfWeek(),e=endOfWeek();
    return{
      skills:this.skillAttemptsIn(s,e),
      cases:this.casesIn(s,e).length,
      questions:this.questionsIn(s,e),
      pages:this.pagesIn(s,e),
      videos:this.videosIn(s,e),
      research:this.researchMinutesIn(s,e)
    };
  },
  lastWeekStats(){
    const s=addDays(startOfWeek(),-7),e=addDays(endOfWeek(),-7);
    return{
      skills:this.skillAttemptsIn(s,e),
      cases:this.casesIn(s,e).length,
      questions:this.questionsIn(s,e),
      pages:this.pagesIn(s,e),
      videos:this.videosIn(s,e),
      research:this.researchMinutesIn(s,e)
    };
  },
  monthStats(){
    const s=startOfMonth(),e=endOfMonth();
    return{
      skills:this.skillAttemptsIn(s,e),
      cases:this.casesIn(s,e).length,
      questions:this.questionsIn(s,e),
      pages:this.pagesIn(s,e),
      videos:this.videosIn(s,e),
      research:this.researchMinutesIn(s,e)
    };
  },
  topSkills(limit=5){
    return Store.get('skills')
      .map(s=>({skill:s,attempts:this.skillAttempts(s.id)}))
      .sort((a,b)=>b.attempts-a.attempts).slice(0,limit);
  },
  topSpecialties(limit=6){
    const counts={};
    Store.get('cases').forEach(c=>{counts[c.specialty]=(counts[c.specialty]||0)+1});
    return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,limit)
      .map(([name,count])=>({name,count}));
  },
  weakestSpecialties(limit=3){
    const stats={};
    Store.get('questionSessions').forEach(s=>{
      const t=s.topic||'General';
      if(!stats[t])stats[t]={correct:0,total:0};
      stats[t].correct+=s.correct||0;
      stats[t].total+=s.count||0;
    });
    return Object.entries(stats).filter(([,v])=>v.total>=5)
      .map(([topic,v])=>({topic,accuracy:Math.round((v.correct/v.total)*100),total:v.total}))
      .sort((a,b)=>a.accuracy-b.accuracy).slice(0,limit);
  },
  estimateBookCompletion(book){
    const sessions=Store.get('readingSessions').filter(r=>r.bookId===book.id);
    if(!sessions.length)return null;
    const recent=sessions.filter(r=>r.date>=addDays(todayISO(),-14));
    const a=avg(recent,r=>r.pages)||avg(sessions,r=>r.pages);
    if(!a)return null;
    const remaining=Math.max(0,(book.totalPages||0)-(book.currentPage||0));
    const days=Math.ceil(remaining/a);
    return addDays(todayISO(),days);
  },
  goalProgress(g){
    const period=g.period||'monthly';
    const start=period==='daily'?todayISO():period==='weekly'?startOfWeek():startOfMonth();
    const end=period==='daily'?todayISO():period==='weekly'?endOfWeek():endOfMonth();
    const map={
      questions:()=>this.questionsIn(start,end).total,
      pages:()=>this.pagesIn(start,end),
      skills:()=>this.skillAttemptsIn(start,end),
      cases:()=>this.casesIn(start,end).length,
      videos:()=>this.videosIn(start,end)
    };
    return{current:map[g.metric]?map[g.metric]():0};
  }
};

/* ---------- Shared helpers ---------- */
function ring(p,size=64,stroke=6,color='var(--primary)'){
  const r=(size-stroke)/2;
  const c=2*Math.PI*r;
  const off=c*(1-clamp(p,0,100)/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="ring">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--ring-bg)" stroke-width="${stroke}" fill="none"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
      transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="50%" text-anchor="middle" dy=".35em"
      fill="var(--text)" font-size="13" font-weight="800">${Math.round(p)}%</text>
  </svg>`;
}
function progressBar(p){
  return `<div class="bar"><i style="width:${clamp(p,0,100)}%"></i></div>`;
}
function hero(score,streak){
  const name=Store.get('settings').profile?.name||'Doctor';
  const d=new Date();
  const dateStr=d.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const hour=d.getHours();
  const greeting=hour<12?'صباح الخير':'مساء الخير';
  return `<div class="hero">
    <div class="hello">${greeting}، ${esc(name)} 👋</div>
    <div class="date">${esc(dateStr)}</div>
    <div class="hero-row">
      <div>
        <div class="hero-label">Medical Progress</div>
        <div class="hero-score">${score}<small>/100</small></div>
      </div>
      <div style="margin-inline-start:auto;text-align:left">
        <div class="hero-streak">🔥 ${streak.current} يوم</div>
        <div class="tiny" style="opacity:.7;margin-top:5px">أفضل: ${streak.best}</div>
      </div>
    </div>
  </div>`;
}

      ${hero(ps.score,streak)}

            <span class="value">${today.questions.total}<small class="muted small"> / ${t.questions}</small></span>

            <span class="value">${today.pages}<small class="muted small"> / ${t.pages}</small></span></div>

function renderTodayPlan(){
  const today=todayISO();
  const tasks=Store.get('tasks').filter(t=>t.date===today);

    return `<div class="card"><div class="card-head"><h3>خطة اليوم</h3></div>

        ${tasks.length?`<div class="list">${tasks.map(t=>`
          <div class="row">
            <input type="checkbox" ${t.done?'checked':''} data-action="toggle-task" data-id="${t.id}" style="width:20px;height:20px">
            <div class="r-main">
              <div class="r-title" style="${t.done?'text-decoration:line-through;opacity:.55':''}">${esc(t.title)}</div>
              <div class="r-sub">${esc(t.category||'')} · ${esc(t.priority||'')}${t.estMin?` · ${t.estMin} د`:''}</div>
            </div>
            <button class="btn btn-ghost btn-sm" data-action="delete-task" data-id="${t.id}">حذف</button>
          </div>`).join('')}</div>`:'<div class="empty"><p>لا مهام اليوم</p></div>'}
      </div>
      <div class="card">
        <div class="card-head"><h3>التايم لاين</h3></div>
        ${renderTimeline()}
      </div>
    `;
  }
};
function renderTimeline(){
  const events=[];
  Store.get('skillSessions').forEach(s=>s.date&&events.push({date:s.date,text:`💉 ${s.skillName||''} × ${s.count||1}`}));
  Store.get('cases').forEach(c=>c.date&&events.push({date:c.date,text:`🩺 حالة: ${c.title}`}));
  Store.get('questionSessions').forEach(s=>s.date&&events.push({date:s.date,text:`❓ ${s.count} سؤال (${s.correct||0} صحيح)`}));
  Store.get('readingSessions').forEach(s=>s.date&&events.push({date:s.date,text:`📖 ${s.pages} صفحة — ${s.bookName||''}`}));
  Store.get('videos').filter(v=>v.completedAt).forEach(v=>events.push({date:v.completedAt.slice(0,10),text:`🎬 ${v.title}`}));
  const byDate={};
  events.forEach(e=>{(byDate[e.date]||=[]).push(e)});
  const dates=Object.keys(byDate).sort().reverse().slice(0,10);
  if(!dates.length)return '<div class="empty"><p>لا نشاطات بعد</p></div>';
  return dates.map(d=>`
    <div style="margin-bottom:12px">
      <div class="bold small mb-8">${fmtDate(d)} · ${fmtDayName(d)}</div>
      <div class="tl">${byDate[d].map(e=>`<div class="tl-item">${esc(e.text)}</div>`).join('')}</div>
    </div>`).join('');
}

Views.analytics={
  title:'Analytics',
  render(){
    const sub=Calc.subScores();
    const weak=Calc.weakestSpecialties(5);
    return `
      <div class="card">
        <div class="card-head"><h3>Medical Progress Score</h3></div>
        <div class="flex items-center gap-10">
          ${ring(Calc.progressScore().score,88,8)}
          <div style="flex:1">
            ${Object.entries({
              'Clinical':sub.clinical,'Study':sub.study,'Questions':sub.questions,
              'Reading':sub.reading,'Research':sub.research
            }).map(([k,v])=>`
              <div style="display:flex;justify-content:space-between;margin-bottom:5px">
                <div class="small bold">${k}</div><div class="small muted">${v}%</div>
              </div>${progressBar(v)}`).join('')}
          </div>
        </div>
      </div>
      ${(!window.Chart||window.__noChart)?'<div class="insight"><div class="ic">📊</div><p>الرسوم البيانية غير متاحة حاليًا لأن مكتبة Chart.js المحلية غير موجودة. تظل كل الإحصاءات والبيانات محفوظة وتعمل دون إنترنت.</p></div>':''}
      <div class="card"><div class="card-head"><h3>الأسئلة (14 يوم)</h3></div>
        <div style="height:180px"><canvas id="ch-q"></canvas></div></div>
      <div class="card"><div class="card-head"><h3>الدقة %</h3></div>
        <div style="height:180px"><canvas id="ch-acc"></canvas></div></div>
      <div class="card"><div class="card-head"><h3>الصفحات اليومية</h3></div>
        <div style="height:180px"><canvas id="ch-pg"></canvas></div></div>
      <div class="card"><div class="card-head"><h3>المهارات السريرية</h3></div>
        <div style="height:180px"><canvas id="ch-sk"></canvas></div></div>
      <div class="card"><div class="card-head"><h3>أكثر التخصصات</h3></div>
        <div style="height:220px"><canvas id="ch-spec"></canvas></div></div>
      <div class="card">
        <div class="card-head"><h3>أضعف المجالات</h3></div>
        ${weak.length?weak.map(w=>`
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">
            <div class="bold">${esc(w.topic)}</div>
            <div class="chip red">${w.accuracy}%</div>
          </div>`).join(''):'<div class="empty"><p>لا بيانات كافية</p></div>'}
      </div>
    `;
  },
  mount(){
    if(!window.Chart||window.__noChart)return;
    const today=todayISO();
    const days=[...Array(14)].map((_,i)=>addDays(today,-13+i));
    const labels=days.map(d=>fmtDateShort(d));
    const common={
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{grid:{display:false},ticks:{color:'#94A3B8',font:{size:10}}},
        y:{grid:{color:'rgba(148,163,184,.15)'},ticks:{color:'#94A3B8',font:{size:10}},beginAtZero:true}
      }
    };
    const mk=(id,type,data,color)=>{
      const el=document.getElementById(id);
      if(!el)return;
      try{
        new Chart(el,{
          type,
          data:{labels,datasets:[{
            data,
            backgroundColor:type==='bar'?color:'rgba(15,76,129,.1)',
            borderColor:color,
            borderWidth:type==='line'?2:0,
            tension:.35,fill:type==='line',borderRadius:6
          }]},
          options:common
        });
      }catch(e){console.warn(e)}
    };
    mk('ch-q','bar',days.map(d=>Calc.questionsIn(d,d).total),'#0F4C81');
    mk('ch-acc','line',days.map(d=>Calc.questionsIn(d,d).accuracy),'#14B8A6');
    mk('ch-pg','bar',days.map(d=>Calc.pagesIn(d,d)),'#D4AF37');
    mk('ch-sk','bar',days.map(d=>Calc.skillAttemptsIn(d,d)),'#0F4C81');

    const specEl=document.getElementById('ch-spec');
    if(specEl){
      const tops=Calc.topSpecialties(6);
      if(tops.length){
        try{
          new Chart(specEl,{
            type:'doughnut',
            data:{
              labels:tops.map(t=>t.name),
              datasets:[{data:tops.map(t=>t.count),
                backgroundColor:['#0F4C81','#14B8A6','#D4AF37','#7DD3FC','#F59E0B','#DC2626']}]
            },
            options:{responsive:true,maintainAspectRatio:false,
              plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:11}}}}}
          });
        }catch(e){console.warn(e)}
      }
    }
  }
};

function weeklySummaryHTML(){

  return `<div class="grid grid-2">
    <div class="stat"><span class="label">أسئلة</span><span class="value">${w.questions.total}</span>
      <span class="sub">${ch(w.questions.total,lw.questions.total)} عن الماضي</span></div>
    <div class="stat"><span class="label">صفحات</span><span class="value">${w.pages}</span>
      <span class="sub">${ch(w.pages,lw.pages)}</span></div>
    <div class="stat"><span class="label">مهارات</span><span class="value">${w.skills}</span>
      <span class="sub">${ch(w.skills,lw.skills)}</span></div>
    <div class="stat"><span class="label">حالات</span><span class="value">${w.cases}</span>
      <span class="sub">${ch(w.cases,lw.cases)}</span></div>
    <div class="stat"><span class="label">فيديوهات</span><span class="value">${w.videos}</span>
      <span class="sub">${ch(w.videos,lw.videos)}</span></div>
    <div class="stat"><span class="label">دقة الأسئلة</span><span class="value">${w.questions.accuracy}%</span></div>
  </div>`;
}
function monthlySummaryHTML(){
  const m=Calc.monthStats();
  const streak=Calc.streak();
  const weak=Calc.weakestSpecialties(1)[0];
  return `<div class="grid grid-2">
    <div class="stat"><span class="label">أسئلة</span><span class="value">${m.questions.total}</span></div>

    <div class="stat"><span class="label">أطول سلسلة</span><span class="value">${streak.best} 🔥</span></div>

document.addEventListener('click',e=>{
  const navBtn=e.target.closest('[data-nav]');
  if(navBtn){navigate(navBtn.dataset.nav);return}

  const tabBtn=e.target.closest('[data-tab]');
  if(tabBtn){
    const g=tabBtn.dataset.tab,id=tabBtn.dataset.tabId;
    if(g==='clinical')navigate('clinical',{tab:id});
    else if(g==='study')navigate('study',{tab:id});
    else if(g==='library')navigate('library',{filter:id});
    return;
  }

  const btn=e.target.closest('[data-action]');
  if(!btn)return;
  const action=btn.dataset.action;
  if(!Actions[action])return;
  try{Actions[action](btn,e)}
  catch(err){
    console.error(err);
    toast('حدث خطأ. بياناتك لم تُحذف.','error');
  }
});

  'import-json'(){
    const input=document.createElement('input');
    input.type='file';
    input.accept='.json,application/json';
    input.onchange=async()=>{
      const file=input.files?.[0];
      if(!file)return;
      try{
        const text=await file.text();
        const obj=JSON.parse(text);
        const backup=obj?.data&&obj.app==='Medical OS'?obj.data:obj;
        if(!backup||typeof backup!=='object'||!backup.settings){
          toast('ملف غير صالح','error');return;
        }
        const count=Store.collections.reduce((n,c)=>n+(Array.isArray(backup[c])?backup[c].length:0),0);
        const choice=prompt(`هذه النسخة تحتوي على ${count} سجلًا. اكتب Replace للاستبدال أو Merge للدمج.`);
        if(!choice)return;
        const def=Store.defaults(); const incoming={...def,...backup,settings:{...def.settings,...(backup.settings||{})}};
        Store.collections.forEach(c=>{if(!Array.isArray(incoming[c]))incoming[c]=[]});
        if(choice.toLowerCase()==='merge'){
          Store.collections.forEach(c=>{const map=new Map(Store.data[c].map(x=>[x.id,x])); incoming[c].forEach(x=>{const old=map.get(x.id);if(!old||String(x.updatedAt||'')>String(old.updatedAt||''))map.set(x.id,x)});Store.data[c]=[...map.values()]});
          Store.data.settings={...Store.data.settings,...incoming.settings};
        }else if(choice.toLowerCase()==='replace') Store.data=incoming;
        else {toast('اختر Replace أو Merge','warn');return}
        await Store.persistAll(); Store.lastSave=new Date().toISOString();
        applyTheme();
        toast('تم الاستيراد','success');
        render();
      }catch(err){
        console.error(err);
        toast('فشل قراءة الملف','error');
      }
    };
    input.click();
  },

    if(!confirm('استبدال البيانات ببيانات تجريبية؟'))return;

============================================================ */
function loadDemoData(){
  const fresh=Store.defaults();
  fresh.settings.profile={name:'Dr. Ahmed',targetExam:'MRCP'};
  Store.data=fresh;

  const today=todayISO();
  const daysAgo=n=>addDays(today,-n);

  // Skills
  const skillNames=['IV Cannulation','ECG','Venipuncture','ABG Sampling','Suturing',
    'Foley Catheter','Blood Sampling','History Taking','CVS Examination','CPR'];
  const skills=skillNames.map((name,i)=>({
    id:uid(),name,
    category:i<5?'Procedures':'Examination',
    target:[50,50,50,30,40,25,50,50,40,10][i],
    createdAt:new Date().toISOString()
  }));
  Store.data.skills=skills;

  // Skill sessions
  const skillSessions=[];
  for(let d=0;d<10;d++){
    const day=daysAgo(d);
    const n=1+Math.floor(Math.random()*3);
    for(let k=0;k<n;k++){
      const s=skills[Math.floor(Math.random()*skills.length)];
      skillSessions.push({
        id:uid(),
        skillId:s.id,skillName:s.name,
        date:day,
        count:1+Math.floor(Math.random()*3),
        setting:['ER','Ward','ICU','OPD'][Math.floor(Math.random()*4)],
        difficulty:'Moderate',
        confidence:3+Math.floor(Math.random()*3),
        createdAt:new Date().toISOString()
      });
    }
  }
  Store.data.skillSessions=skillSessions;

  // Cases
  const caseData=[
    ['Acute MI','Cardiology','ER'],
    ['Community Acquired Pneumonia','Respiratory','Ward'],
    ['Diabetic Ketoacidosis','Endocrinology','ICU'],
    ['Ischemic Stroke','Neurology','ER'],
    ['Acute Appendicitis','Surgery','OR']
  ];
  Store.data.cases=caseData.map(([title,specialty,dept],i)=>({
    id:uid(),title,specialty,
    date:daysAgo(i*2),
    department:dept,ageGroup:'Adult',

/* ============================================================

============================================================ */
function applyTheme(){
  const s=Store.get('settings');
  document.documentElement.dataset.theme=s.theme||'light';
  const meta=document.querySelector('meta[name=theme-color]');
  if(meta)meta.content=s.theme==='dark'?'#0B1220':'#0F4C81';
}

/* ============================================================
   BOOT
============================================================ */
(async function boot(){
  try{
    await Promise.race([
      Store.load(),
      new Promise(resolve=>setTimeout(()=>{if(!Store.data)Store.data=Store.defaults();resolve()},2500))
    ]);
  }catch(e){
    console.warn('Database startup fallback',e);
    if(!Store.data)Store.data=Store.defaults();
  }
  applyTheme();
  const isFirst=!Store.collections.some(c=>Store.get(c).length);
  render();
  const loading=$('#loading'); if(loading)loading.hidden=true;
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js').catch(e=>console.warn('Offline setup failed',e));
  if(isFirst)setTimeout(showWelcome,300);
  else setTimeout(()=>toast('MEDICAL OS جاهز ⚕️'),500);

  document.addEventListener('keydown',e=>{
    if(e.key==='Escape')closeSheet();
  });
})();
</script>
